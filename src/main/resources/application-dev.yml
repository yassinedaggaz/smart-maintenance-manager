# Configuration additionnelle pour développement

# Base de données - Initialisation
# Cette configuration initialise la BD avec des données de test

# Activer la création de schéma au démarrage
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logs détaillés pour Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator - Health endpoint
management.endpoints.web.exposure.include=health,info,metrics

# Jackson - Sérialisation JSON
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true

# Flyway - Versionning des migrations (optionnel)
# spring.flyway.enabled=false

# Cache
spring.cache.type=simple
